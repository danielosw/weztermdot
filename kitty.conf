# Kitty Terminal Configuration
# Converted from WezTerm (wezterm.lua)

# Shell (Linux)
shell /usr/bin/fish

# Font configuration
font_family      CaskaydiaCove NF
bold_font        auto
italic_font      auto
bold_italic_font auto

# Font features (OpenType/HarfBuzz)
# Note: The PostScript name below may need adjusting for your installed font variant
font_features CaskaydiaCoveNF-Regular +calt +case +ccmp +fina +init +rclt +rlig +ss02 +ss19 +ss20 +zero +mark +mkmk
font_features CaskaydiaCoveNF-Bold +calt +case +ccmp +fina +init +rclt +rlig +ss02 +ss19 +ss20 +zero +mark +mkmk
font_features CaskaydiaCoveNF-Italic +calt +case +ccmp +fina +init +rclt +rlig +ss02 +ss19 +ss20 +zero +mark +mkmk
font_features CaskaydiaCoveNF-BoldItalic +calt +case +ccmp +fina +init +rclt +rlig +ss02 +ss19 +ss20 +zero +mark +mkmk

# Window
background_opacity 1.0

# Tab bar
tab_bar_edge bottom
tab_bar_style fade

# Performance
# WezTerm max_fps 75 ≈ ~13ms repaint delay in Kitty
repaint_delay 13

# URL handling (Kitty has built-in URL detection)
detect_urls yes
url_style curly

# Dracula (Official) color scheme
foreground            #f8f8f2
background            #282a36
selection_foreground  #ffffff
selection_background  #44475a
cursor                #f8f8f2
cursor_text_color     #282a36

url_color #8be9fd

# ANSI colors (Dracula)
color0  #21222c
color1  #ff5555
color2  #50fa7b
color3  #f1fa8c
color4  #bd93f9
color5  #ff79c6
color6  #8be9fd
color7  #f8f8f2

# Bright colors (Dracula)
color8  #6272a4
color9  #ff6e6e
color10 #69ff94
color11 #ffffa5
color12 #d6acff
color13 #ff92df
color14 #a4ffff
color15 #ffffff

# To use a cyberdream theme instead of Dracula, comment out the colors above
# and uncomment one of the following lines:
# include kitty/cyberdream.conf
# include kitty/cyberdream-light.conf
